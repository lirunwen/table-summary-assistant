name: 构建 Windows 离线安装包

# 触发方式：
#   1) 打 tag 推送（推荐）：git tag v0.1.1 && git push origin v0.1.1
#      → 自动构建并把 zip 挂到 Release，任何 Windows 电脑用浏览器即可下载
#   2) 手动：Actions 页面点 Run workflow，产物在 Artifacts 里（需登录 GitHub 才能下）
#
# 为什么必须由 GitHub 构建：PyInstaller 不能跨平台交叉编译，
# 在 macOS / Linux 上打不出 Windows 的 exe。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（仅用于产物命名，可留空自动读取 backend/config.py）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 · PyInstaller
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # windows-latest 默认控制台是 cp1252，脚本里 print 中文会抛
      # UnicodeEncodeError（本地化日志也变成乱码）。统一按 UTF-8 输出。
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: 安装依赖
        id: deps
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pyinstaller

      # red-black-tree-mod 1.22 只有 sdist，新版 pip 解包时会 EEXIST 失败，
      # 导致整个 requirements 安装中止。这里手动解包后本地安装再重试。
      - name: 兜底安装 red-black-tree-mod 并重试
        if: steps.deps.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "rbtm"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          python -m pip download red-black-tree-mod==1.22 --no-deps --no-binary :all: -d $dir
          Push-Location $dir
          tar -xzf "red-black-tree-mod-1.22.tar.gz"
          python -m pip install (Resolve-Path ".\red-black-tree-mod-1.22")
          Pop-Location
          python -m pip install -r requirements-dev.txt
          python -m pip install pyinstaller

      - name: 校验依赖
        run: python -c "import flask, openpyxl, xlrd, waitress, extract_msg; print('deps ok')"

      - name: 回归测试
        run: python -m pytest tests/test_regressions.py -q

      - name: 端到端冒烟测试
        env:
          HUIYI_DATA_DIR: ${{ runner.temp }}\huiyi_smoke
        run: python tests/smoke.py

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean packaging/huiyi.spec

      - name: 组装发布目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            if ("${{ github.ref_name }}" -match '^v(.+)$') { $ver = $Matches[1] }
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = (python -c "from backend.config import APP_VERSION; print(APP_VERSION)").Trim()
          }
          Write-Host "版本号: $ver"

          $stage = "dist/stage/表格汇总助手"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/HuiYi/*" $stage -Recurse -Force
          Copy-Item "packaging/launcher.bat" "$stage/启动.bat" -Force
          # 再放一份 ASCII 名字的启动器：某些解压工具（老版 WinRAR / 7-Zip 配置了
          # 非 UTF-8 文件名）会把中文名解成乱码，留着这个总能双击打开。
          Copy-Item "packaging/launcher.bat" "$stage/start.bat" -Force
          Copy-Item "packaging/使用说明-打包版.txt" "$stage/使用说明.txt" -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$stage/LICENSE.txt" -Force }
          if (Test-Path "samples") { Copy-Item "samples" "$stage/samples" -Recurse -Force }

          # zip 名必须全 ASCII：softprops/action-gh-release 会把文件名里的非 ASCII
          # 字符直接删掉，中文前缀会导致资产变成 "-v0.2.0-windows-x64.zip"。
          $zip = "dist/TableSummaryAssistant-v$ver-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "ZIP_NAME=$(Split-Path $zip -Leaf)" >> $env:GITHUB_ENV

          # 体积体检：extract-msg 会拖进 oletools / cryptography 等一串依赖
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "产物大小: $mb MB"
          "ZIP_MB=$mb" >> $env:GITHUB_ENV

          # 校验信息：一起发布 .sha256，Windows 上可用
          #   certutil -hashfile 文件名.zip SHA256
          # 对照，或 PowerShell 的 Get-FileHash。
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          $leaf = Split-Path $zip -Leaf
          # 注意必须写 ${zip}.sha256：PowerShell 会把 "$zip.sha256" 当成属性访问
          "$hash  $leaf" | Out-File -FilePath "${zip}.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"
          "SHA256=$hash" >> $env:GITHUB_ENV
          "APP_VER=$ver" >> $env:GITHUB_ENV

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: 表格汇总助手-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30

      - name: 发布到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 下载

            点下方 **Assets** 里的 `TableSummaryAssistant-v*-windows-x64.zip`（${{ env.ZIP_MB }} MB），
            同目录下的 `.sha256` 是校验文件。

            **版本**：`${{ env.APP_VER }}` · **平台**：Windows 10 / 11（64 位，x64）· **格式**：免安装 zip（解压即用，无需管理员权限）

            **SHA256**：`${{ env.SHA256 }}`

            ```bat
            :: 下载后先校验，输出应与上面一致
            certutil -hashfile TableSummaryAssistant-v*-windows-x64.zip SHA256
            ```

            解压后双击「启动.bat」（或 `start.bat`）即可，**目标电脑不需要安装 Python，也不需要管理员权限**。

            ## 适用环境

            - Windows 10 / 11（64 位）
            - 全程离线，数据只保存在程序目录的 `data\` 文件夹
            - 首次启动会自动打开浏览器；关闭黑色窗口即停止服务

            ## 说明

            本包由 GitHub Actions 在 `windows-latest` 上自动构建，
            构建前已通过 `tests/test_regressions.py` 与 `tests/smoke.py`。
